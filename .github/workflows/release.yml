name: Build & Publish Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.5.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG. Expected format: vX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build personal target
        run: |
          npm run build:personal
          mkdir -p dist_archive/personal
          cp -r dist/* dist_archive/personal/

      - name: Build public target
        run: |
          npm run build:public
          mkdir -p dist_archive/public
          cp -r dist/* dist_archive/public/
          rm -rf dist
          mkdir -p dist
          mv dist_archive/personal dist/personal
          mv dist_archive/public dist/public

      - name: Package extension archives
        run: |
          (cd dist/personal && zip -r "../../anime-korean-subtitle-personal-${TAG}.zip" .)
          (cd dist/public && zip -r "../../anime-korean-subtitle-public-${TAG}.zip" .)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "puruuun"
          git config user.email "188972188+puruuun@users.noreply.github.com"
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" "anime-korean-subtitle-personal-${TAG}.zip" "anime-korean-subtitle-public-${TAG}.zip" --clobber || gh release create "$TAG" "anime-korean-subtitle-personal-${TAG}.zip" "anime-korean-subtitle-public-${TAG}.zip" --title "Anime Korean Subtitle ${TAG}" --generate-notes --latest
