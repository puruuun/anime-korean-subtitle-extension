name: Build & Publish Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.5.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve release tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG. Expected format: vX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify tag and version consistency
        run: node scripts/verify-build-artifacts.mjs --version-only --expected-tag="${TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build personal package
        run: |
          npm run build:personal
          mkdir -p release_stage/personal/extension
          cp -r dist/* release_stage/personal/extension/

      - name: Build public package
        run: |
          npm run build:public
          mkdir -p release_stage/public/extension
          cp -r dist/* release_stage/public/extension/

      - name: Verify release build artifacts
        run: node scripts/verify-build-artifacts.mjs --expected-tag="${TAG}" --personal-dir=release_stage/personal/extension --public-dir=release_stage/public/extension

      - name: Package release archives
        run: |
          (cd release_stage/personal && zip -r "../../anime-korean-subtitle-${TAG}.zip" extension)
          (cd release_stage/public && zip -r "../../anime-korean-subtitle-public-${TAG}.zip" extension)
          git archive --format=zip --prefix="anime-korean-subtitle-${TAG#v}/" -o "anime-korean-subtitle-source-${TAG}.zip" HEAD
          sha256sum "anime-korean-subtitle-${TAG}.zip" "anime-korean-subtitle-public-${TAG}.zip" "anime-korean-subtitle-source-${TAG}.zip" > "SHA256SUMS-${TAG}.txt"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq '.body' > generated-changelog.md 2>/dev/null || [ ! -s generated-changelog.md ]; then
            echo "- See commit history for details." > generated-changelog.md
          fi
          cat << 'EOF' > release-notes-header.md
          ## ${TAG}

          Miruro / Re:ANIME 회차 감지 및 외부 한국어 자막 연동 / 실시간 AI 번역 Chrome 확장프로그램의 정식 릴리스입니다.

          ### 배포 패키지 안내

          | 파일명 | 권한 프로필 | 설명 |
          | :--- | :--- | :--- |
          | `anime-korean-subtitle-${TAG}.zip` | 개인용 (`<all_urls>`) | 기본 권한 자동 허용, 재생 중 추가 권한 팝업 없음 (권장) |
          | `anime-korean-subtitle-public-${TAG}.zip` | 공개용 (선언 호스트) | 최소 권한 원칙, 외부 호스트 초기 설정 시 수동 승인 |
          | `anime-korean-subtitle-source-${TAG}.zip` | 소스 코드 | 태그 커밋 기준 전체 소스 코드 아카이브 |
          | `SHA256SUMS-${TAG}.txt` | 체크섬 | SHA-256 무결성 검증 체크섬 파일 |

          ### 설치 방법
          1. 원하는 패키지(`anime-korean-subtitle-${TAG}.zip`)를 다운로드하여 압축을 해제합니다.
          2. Chrome에서 `chrome://extensions` 접속 후 우측 상단 **개발자 모드**를 활성화합니다.
          3. **압축해제된 확장 프로그램 로드**를 클릭하고 해제된 폴더 내의 `extension` 디렉토리를 선택합니다.

          ---

          ### 변경 사항 (Changelog)

          EOF
          cat << 'EOF' > release-notes-footer.md

          ---

          ### 품질 검증 요약 (Quality Gate Summary)
          - TypeScript 정적 타입 검사 (`npm run typecheck`): 통과
          - 전체 단위 테스트 (`npm test`): 통과
          - 개인용 및 공개용 듀얼 빌드 프로필 검증 완료
          - Source commit SHA: `${GITHUB_SHA}`
          EOF
          sed -i "s/\${TAG}/${TAG}/g" release-notes-header.md
          sed -i "s/\${GITHUB_SHA}/${GITHUB_SHA}/g" release-notes-footer.md
          cat release-notes-header.md generated-changelog.md release-notes-footer.md > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "puruuun"
          git config user.email "188972188+puruuun@users.noreply.github.com"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "anime-korean-subtitle-${TAG}.zip" \
              "anime-korean-subtitle-public-${TAG}.zip" \
              "anime-korean-subtitle-source-${TAG}.zip" \
              "SHA256SUMS-${TAG}.txt" \
              --clobber
            gh release edit "$TAG" --title "${TAG}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" \
              "anime-korean-subtitle-${TAG}.zip" \
              "anime-korean-subtitle-public-${TAG}.zip" \
              "anime-korean-subtitle-source-${TAG}.zip" \
              "SHA256SUMS-${TAG}.txt" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
