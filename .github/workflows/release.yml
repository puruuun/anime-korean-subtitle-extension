name: Build & Publish Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.5.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve release tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG. Expected format: vX.Y.Z"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build personal package
        run: |
          npm run build:personal
          mkdir -p release_stage/personal/extension
          cp -r dist/* release_stage/personal/extension/

      - name: Build public package
        run: |
          npm run build:public
          mkdir -p release_stage/public/extension
          cp -r dist/* release_stage/public/extension/

      - name: Package release archives
        run: |
          (cd release_stage/personal && zip -r "../../anime-korean-subtitle-${TAG}.zip" extension)
          (cd release_stage/public && zip -r "../../anime-korean-subtitle-public-${TAG}.zip" extension)
          git archive --format=zip --prefix="anime-korean-subtitle-${TAG#v}/" -o "anime-korean-subtitle-source-${TAG}.zip" HEAD
          sha256sum "anime-korean-subtitle-${TAG}.zip" "anime-korean-subtitle-public-${TAG}.zip" "anime-korean-subtitle-source-${TAG}.zip" > "SHA256SUMS-${TAG}.txt"

      - name: Generate release notes
        run: |
          cat << 'EOF' > release-notes.md
          ## ${TAG}

          Miruro / Re:ANIME 회차 감지 및 외부 한국어 자막 연동 / 실시간 AI 번역 Chrome 확장프로그램의 정식 릴리스입니다.

          ### 배포 패키지 안내

          | 파일명 | 권한 프로필 | 설명 |
          | :--- | :--- | :--- |
          | `anime-korean-subtitle-${TAG}.zip` | 개인용 (`<all_urls>`) | 기본 권한 자동 허용, 재생 중 추가 권한 팝업 없음 (권장) |
          | `anime-korean-subtitle-public-${TAG}.zip` | 공개용 (선언 호스트) | 최소 권한 원칙, 외부 호스트 초기 설정 시 수동 승인 |
          | `anime-korean-subtitle-source-${TAG}.zip` | 소스 코드 | 태그 커밋 기준 전체 소스 코드 아카이브 |
          | `SHA256SUMS-${TAG}.txt` | 체크섬 | SHA-256 무결성 검증 체크섬 파일 |

          ### 설치 방법
          1. 원하는 패키지(`anime-korean-subtitle-${TAG}.zip`)를 다운로드하여 압축을 해제합니다.
          2. Chrome에서 `chrome://extensions` 접속 후 우측 상단 **개발자 모드**를 활성화합니다.
          3. **압축해제된 확장 프로그램 로드**를 클릭하고 해제된 폴더 내의 `extension` 디렉토리를 선택합니다.

          ---

          ### 주요 변경 사항 (Changelog)

          #### 1. 핵심 버그 및 정확도 수정 (Bug Fixes)
          - **TASK-001**: 내장 일본어(HLS) 자막 로드 시 영어 트랙만 필터링하는 버그 수정
          - **TASK-002**: 번역 프롬프트 불필요 필드(`previousTranslations`) 정리 및 작품 컨텍스트(`animeTitle`) 주입
          - **TASK-003**: ASS/SSA 자막 파싱 시 드로잉 명령(`{\p1}...{\p0}`) 좌표 대사 노출 방지
          - **TASK-004**: SMI(SAMI) 자막 종료 싱크 처리 보강 및 비정상 잔류 대사 안전장치 추가

          #### 2. 성능 및 안정성 개선 (Performance & Reliability)
          - **TASK-005**: HLS 자막 세그먼트 제한적 병렬 다운로드 도입 (세그먼트 로드 병목 해소)
          - **TASK-006**: IndexedDB 캐시 만료 항목 정리(Eviction/GC) 메커니즘 추가
          - **TASK-007**: `SubtitleRenderer` 프레임 렌더링 최적화 및 정렬된 Cue 탐색 도입
          - **TASK-008**: 팝업(Popup) 상태 폴링 경량화 (불필요한 반복 조회 분리)

          #### 3. 기능 개선 및 구조 리팩토링 (Enhancements & Refactoring)
          - **TASK-009**: 플레이어 키보드 단축키 지원 (`Alt+[`, `Alt+]` 싱크 ±0.5s 조절, `Alt+\` 싱크 리셋, `Alt+J` 일본어 자막 토글)
          - **TASK-010**: `messageRouter.ts` 책임 분리 리팩토링 (`routerTypes.ts`, `japaneseCoordinator.ts` 모듈화)
          - **TASK-011**: GitHub Actions CI/Release 자동화 워크플로우 구축 및 Git 단일 작성자(`puruuun`) 규칙 명시

          #### 4. 일본어 원문 자막 싱크 및 매칭 개선 (Issue #3)
          - **WEBRip/스트리밍 소스 우선 선택**: DMMTV/Netflix 등 웹 스트리밍 및 리타이밍 소스 가산점(+40), 오프셋 불일치 가능성이 높은 TV 방송 원본 캡처 감점(-25), 깔끔한 `.srt` 포맷 우선(+5)
          - **한국어 자막 기준 자동 싱크 보정**: 한국어 자막 타임라인과 일본어 자막 대사 시작 경계를 비교하여 1.5초 이상 밀려 있는 TV 방송 자막 등을 자동으로 타임스탬프 보정 (`alignJapaneseCues`)
          - **2기 이상 누적 회차 매칭**: 2기 이후 파일명이 누적 회차(예: 12화 → 24화)로 표기된 경우 `episodeOffset`을 반영하여 정상 인식 및 매칭

          #### 5. 구작/미등록 애니메이션 한국어 자막 웹 탐색 및 블로그 해석기 고도화 (Issue #5, Issue #7)
          - **티스토리 & 네이버 블로그 전용 리졸버 (`TistoryResolver`, `NaverBlogResolver`)**: 티스토리 내부 검색(`/search/...`) 및 파일블록 용량 표기 정규화, 네이버 블로그 `mainFrame` 언랩·`aPostFiles` 첨부파일 추출·`PostSearchList.naver` 이전 회차 탐색 지원
          - **합본/다중 ZIP 회차 자동 선별 (`archive.ts`, `GenericHtmlResolver.ts`)**: 범위형 압축파일(`1~12화.zip`, `합본`, `전편`, `완결`) 인식 및 압축파일 내 다중 파일 존재 시 특전(OP/ED/PV) 제외, Web/BD 우선 가산점 및 확장자 우선순위로 최적 자막 자동 선택
          - **Wikidata 한국어 제목 자동 확보 (`koreanTitleResolver.ts`)**: 한글 제목이 없는 옛날 작품의 AniList ID(`P8729`)/MAL ID(`P4086`) 및 원제를 기반으로 위키데이터에서 공식 한국어 제목·별칭 자동 조회 및 7일 캐싱
          - **웹 한국어 자막 폴백 검색 및 Google Custom Search 연동 (`WebKoreanSubtitleProvider.ts`)**: Anissia 미등록/만료 작품 재생 시 AI 번역 전 Google Custom Search JSON API(선택 설정)·네이버·DuckDuckGo 검색으로 자막 블로그를 찾아 회차별로 자동 적용

          ---

          ### 품질 검증 요약 (Quality Gate Summary)
          - TypeScript 정적 타입 검사 (`npm run typecheck`): 에러 0건 통과
          - 전체 단위 테스트 (`npm test`): 29개 파일 289개 단위 테스트 전체 통과
          - 개인용 및 공개용 듀얼 빌드 프로필 무결성 검증 완료
          - Source commit SHA: `${GITHUB_SHA}`
          EOF
          sed -i "s/\${TAG}/${TAG}/g" release-notes.md
          sed -i "s/\${GITHUB_SHA}/${GITHUB_SHA}/g" release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "puruuun"
          git config user.email "188972188+puruuun@users.noreply.github.com"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "anime-korean-subtitle-${TAG}.zip" \
              "anime-korean-subtitle-public-${TAG}.zip" \
              "anime-korean-subtitle-source-${TAG}.zip" \
              "SHA256SUMS-${TAG}.txt" \
              --clobber
            gh release edit "$TAG" --title "${TAG}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" \
              "anime-korean-subtitle-${TAG}.zip" \
              "anime-korean-subtitle-public-${TAG}.zip" \
              "anime-korean-subtitle-source-${TAG}.zip" \
              "SHA256SUMS-${TAG}.txt" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
